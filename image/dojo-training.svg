<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
  <title id="title">伝統的な空手道場</title>
  <desc id="desc">黒茶色の木組み、障子、畳、木床、空手道の掛け軸がある静かな道場。</desc>
  <defs>
    <linearGradient id="rearWall" x2="0" y2="1"><stop stop-color="#594432"/><stop offset="1" stop-color="#332a20"/></linearGradient>
    <linearGradient id="shoji" x2="0" y2="1"><stop stop-color="#f2dfb9"/><stop offset="1" stop-color="#b99568"/></linearGradient>
    <linearGradient id="tatami" x2="0" y2="1"><stop stop-color="#a6a477"/><stop offset="1" stop-color="#65705a"/></linearGradient>
    <linearGradient id="woodFloor" x2="0" y2="1"><stop stop-color="#8c6240"/><stop offset="1" stop-color="#4b3325"/></linearGradient>
    <radialGradient id="windowGlow"><stop stop-color="#fff0c9" stop-opacity=".68"/><stop offset="1" stop-color="#eacb91" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <style>
    .sunlight{animation:lightBreath 7s ease-in-out infinite alternate;transform-origin:210px 220px}
    .dust{animation:float 7s ease-in-out infinite alternate}
    @keyframes lightBreath{to{opacity:.5;transform:scale(1.1)}}
    @keyframes float{to{opacity:.4;transform:translateY(-7px)}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
  </style>
  <rect width="960" height="700" fill="#191b18"/>
  <path d="M0 0h960v429H0z" fill="url(#rearWall)"/>
  <path d="M0 48h960M0 79h960" stroke="#201b16" stroke-width="18"/>
  <path d="M48 36v388M312 43v366M650 43v366M914 36v388" stroke="#241b14" stroke-width="26"/>
  <path d="M61 100h237v240H61zM327 101h307v239H327zM665 100h233v240H665z" fill="url(#shoji)" stroke="#211b16" stroke-width="14"/>
  <g stroke="#513c2b" stroke-width="9" opacity=".9">
    <path d="M91 107v226M139 107v226M187 107v226M235 107v226M280 107v226M61 163h237M61 222h237M61 281h237"/>
    <path d="M363 107v226M412 107v226M461 107v226M510 107v226M559 107v226M608 107v226M327 160h307M327 219h307M327 278h307"/>
    <path d="M694 107v226M742 107v226M790 107v226M838 107v226M885 107v226M665 163h233M665 222h233M665 281h233"/>
  </g>
  <path d="M0 350h960v67H0z" fill="#292117"/>
  <path d="M0 361h960M0 407h960" stroke="#82613e" stroke-width="8"/>
  <path class="sunlight" d="M0 0h960v430H0z" fill="url(#windowGlow)" filter="url(#glow)"/>
  <path d="M400 103h160l-10 30H410z" fill="#4a3522"/>
  <path d="M417 127h126v184H417z" fill="#28221a" stroke="#171411" stroke-width="8"/>
  <path d="M427 137h106v164H427z" fill="#eee1c4"/>
  <path d="M438 148h84v142H438z" fill="#d8c5a0"/>
  <path d="M480 152v133" stroke="#a88b5e" stroke-width="3"/>
  <text x="463" y="211" text-anchor="middle" fill="#513d2b" font-size="37" font-family="serif" font-weight="700">空</text>
  <text x="497" y="258" text-anchor="middle" fill="#513d2b" font-size="37" font-family="serif" font-weight="700">手</text>
  <path d="M0 410h960v145H0z" fill="url(#tatami)"/>
  <path d="M0 410h960M0 551h960" stroke="#353d32" stroke-width="13"/>
