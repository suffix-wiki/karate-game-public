  <path d="M0 554h960v146H0z" fill="url(#woodFloor)"/>
  <path d="M0 600h960M0 650h960M0 679h960" stroke="#c09260" stroke-opacity=".24" stroke-width="4"/>
  <path d="M120 555l-34 145M340 555l-12 145M560 555l13 145M780 555l37 145" stroke="#291f18" stroke-opacity=".25" stroke-width="4"/>
  <path d="M21 39h918v13H21zM19 52h17v357H19zM924 52h17v357h-17z" fill="#6d4b2d"/>
  <g class="dust" fill="#ead3a0" opacity=".18"><circle cx="270" cy="458" r="3"/><circle cx="706" cy="482" r="2.5"/><circle cx="548" cy="369" r="2"/></g>
</svg>