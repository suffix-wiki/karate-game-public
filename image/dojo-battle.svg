<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">決戦の道場</title>
  <desc id="desc">黄金の光が差し込む、巨大な木造空手道場の決戦場。</desc>
  <defs>
    <linearGradient id="ceiling" x2="0" y2="1">
      <stop stop-color="#171820"/>
      <stop offset="1" stop-color="#39302a"/>
    </linearGradient>
    <linearGradient id="rear-wall" x2="0" y2="1">
      <stop stop-color="#69452b"/>
      <stop offset="1" stop-color="#251f1a"/>
    </linearGradient>
    <linearGradient id="floor" x2="0" y2="1">
      <stop stop-color="#84603c"/>
      <stop offset=".5" stop-color="#513a2b"/>
      <stop offset="1" stop-color="#201b19"/>
    </linearGradient>
    <linearGradient id="sunbeam" x2="0" y2="1">
      <stop stop-color="#fff0b1" stop-opacity=".8"/>
      <stop offset="1" stop-color="#e9a947" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="arena-glow">
      <stop stop-color="#f7d27b" stop-opacity=".46"/>
      <stop offset="1" stop-color="#f7d27b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="screen-grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M0 0v42M0 0h42" fill="none" stroke="#62472f" stroke-width="3" opacity=".72"/>
    </pattern>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="haze">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

