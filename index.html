<!DOCTYPE html>
<html lang="ja">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>習慣化・稽古RPG - 空手道場</title>
  <!-- 外部CSSの読み込み -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/screens/home.css">
  <link rel="stylesheet" href="css/screens/battle.css">
  <!-- 外部JavaScriptの読み込み -->
  <script defer src="js/loader.js"></script>
  <script defer src="js/game-data.js"></script>
  <script defer src="js/script.js"></script>
  <script defer src="js/screens/story.js"></script>
  <script defer src="js/screens/home.js"></script>
  <script defer src="js/screens/training.js"></script>
  <script defer src="js/screens/missions.js"></script>
  <script defer src="js/screens/character-edit.js"></script>
  <script defer src="js/screens/stage-select.js"></script>
  <script defer src="js/screens/battle.js"></script>
  <script defer src="js/screens/fitting.js"></script>
  <script defer src="js/screens/lab.js"></script>
  <script defer src="js/screens/shops.js"></script>
  <script defer src="js/screens/flea-market.js"></script>
  <script defer src="js/screens/gacha.js"></script>
  <script defer src="js/screens/init.js"></script>
  </head>
<body>

<div id="app-container">
  <header>
    <button type="button" class="header-title" onclick="requestAdminAccess()" aria-label="管理画面を開く">
      🥋 <span>稽古RPG</span>
    </button>
    <div class="header-gold-display">
      💰 <span id="header-gold-val">0</span>円
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-back" onclick="goHome()" style="display:none;">
        🏠 <span>ホーム</span>
      </button>
      <button class="icon-btn" onclick="openScreen('screen-settings')">
        ⚙️ <span>設定</span>
      </button>
    </div>
  </header>

  <div id="main-content">
  </div>

  <div id="toast-container"></div>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-box" id="modal-box"></div>
  </div>
</div>
</body>
</html>
