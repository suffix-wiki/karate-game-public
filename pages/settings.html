    <!-- SETTINGS -->
    <div id="screen-settings" class="screen">
      <div class="card">
        <div class="card-title">⚙️ サウンド設定</div>
        <div style="display:flex; flex-direction:column; gap:12px; margin-top:10px;">
          <div>
            <label style="font-size:0.8rem;">🎵 BGM 音量</label>
            <input type="range" id="volume-bgm" min="0" max="1" step="0.05" value="0.2" onchange="updateVolume()">
          </div>
          <div>
            <label style="font-size:0.8rem;">💥 SE (効果音) 音量</label>
            <input type="range" id="volume-se" min="0" max="1" step="0.05" value="0.3" onchange="updateVolume()">
          </div>
        </div>
      </div>
    </div>
