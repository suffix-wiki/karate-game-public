<!-- BATTLE SCREEN -->
    <div id="screen-battle" class="screen">
      <div id="damage-overlay"></div>

      <div id="battle-layer-bg" class="battle-layer-bg"></div>
      <div class="battle-enemy-nametag" id="battle-enemy-name">睡魔</div>

      <div class="battle-layer-chars">
        <div class="char-3d-party-wrap" id="battle-party-3d"></div>
        <div class="battle-enemies-container" id="battle-enemies-3d-container"></div>
      </div>

      <div class="battle-layer-ui">
        <div class="battle-log" id="battle-log">バトル開始！</div>
        <div class="battle-ui-bottom">
          <div class="battle-commands-left" id="battle-commands-area">
            <button class="cmd-btn" onclick="executeBattleAction('attack')">🥊 通常攻撃</button>
            <button class="cmd-btn" onclick="openBattleSubMenu('attack_skill')">💥 攻撃技</button>
            <button class="cmd-btn" onclick="openBattleSubMenu('defend_skill')">🛡️ 防御技</button>
            <button class="cmd-btn" onclick="openBattleSubMenu('heal_skill')">✨ 回復技</button>
            <button class="cmd-btn" onclick="openBattleSubMenu('item')">🎒 道具</button>
            <button class="cmd-btn" onclick="executeBattleAction('run')">🏃 逃げる</button>
          </div>
          <div class="battle-status-right" id="battle-party-status-right"></div>
        </div>
      </div>
    </div>
