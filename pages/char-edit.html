<!-- CHAR EDIT -->
    <div id="screen-char-edit" class="screen">
      <div class="card">
        <div class="card-title">👤 主人公・仲間設定</div>
        <div class="tab-row" id="char-edit-tabs"></div>
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
          <div>
            <label style="font-size:0.75rem;">名前</label>
            <input type="text" id="edit-name" value="押忍たろう">
          </div>
          <div style="display:flex; gap:8px;">
            <div style="flex:1;">
              <label style="font-size:0.75rem;">性別</label>
              <select id="edit-gender">
                <option value="男">男</option>
                <option value="女">女</option>
                <option value="その他">その他</option>
              </select>
            </div>
            <div style="flex:1;">
              <label style="font-size:0.75rem;">年齢</label>
              <input type="number" id="edit-age" value="15">
            </div>
          </div>
          <label style="font-size:0.75rem; margin-top:4px;">アバター選択</label>
          <div id="avatar-grid" style="display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; max-height:160px; overflow-y:auto;"></div>
          <button class="btn btn-gold" onclick="saveCharSettings()" style="margin-top:10px;">保存する</button>
        </div>
      </div>
    </div>
